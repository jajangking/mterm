[workspace]
resolver = "2"
members = ["crates/core", "crates/jni", "crates/pty", "crates/mterm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/mterm"

[workspace.dependencies]
vte = "0.14"
libc = "0.2"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
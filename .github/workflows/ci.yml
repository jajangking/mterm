# mterm CI — build Rust + Android APK (dijalankan di GitHub, bukan Termux)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

      # M4: biner Linux + tarball untuk distro glibc (ubuntu-latest).
      - name: Build release binary (Linux)
        run: cargo build --release -p mterm-cli
      - name: Package tarball
        run: |
          mkdir -p dist/bin
          cp target/release/mterm dist/bin/mterm
          cp scripts/install.sh dist/install.sh
          printf 'mterm biner Linux x86_64 (glibc). Pakai: ./install.sh\n' > dist/README.txt
          tar -czf mterm-linux-x86_64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: mterm-linux-x86_64
          path: mterm-linux-x86_64.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      # cargo-ndk (cached binary)
      - uses: actions/cache@v4
        id: cache-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-latest
      - if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      # Rust → shared lib untuk arm64
      - run: cargo ndk -t arm64-v8a -o app/app/src/main/jniLibs build -p mterm-jni --release

      # Android SDK + APK
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Build signed release APK
        working-directory: app
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log
          exit ${PIPESTATUS[0]}
      - name: Publish failure log for diagnosis
        if: failure()
        working-directory: app
        run: |
          git config user.name "mterm-ci"
          git config user.email "ci@mterm.local"
          git switch -c ci-logs 2>/dev/null || git switch ci-logs
          mkdir -p .ci-logs
          ts=$(date +%s)
          for lf in build.log build-release.log; do
            [ -f "$lf" ] && cp "$lf" ".ci-logs/${ts}-${lf}" 2>/dev/null || true
          done
          git add ".ci-logs/" 2>/dev/null || true
          git commit -m "ci logs $ts" || true
          git push --force --set-upstream origin ci-logs || true
      - uses: actions/upload-artifact@v4
        with:
          name: mterm-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mterm-release-apk
          path: app/app/build/outputs/apk/release/*.apk
